<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bynder NLS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #F7F8FA;
    --surface:   #FFFFFF;
    --surface2:  #F0F1F4;
    --border:    #E4E6EC;
    --text:      #111318;
    --muted:     #8A8F9E;
    --accent:    #126DFE;
    --success:   #16A34A;
    --warn:      #D97706;
    --danger:    #DC2626;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── TOPBAR ── */
  #topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    height: 52px;
    display: flex;
    align-items: center;
    padding: 0 32px;
    gap: 8px;
  }
  .topbar-logo {
    display: flex;
    align-items: center;
  }
  .topbar-divider {
    width: 1px; height: 16px;
    background: var(--border);
    margin: 0 4px;
  }
  .topbar-label {
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
  }
  .topbar-spacer { flex: 1; }
  .topbar-powered {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
  }
  .topbar-powered img {
    height: 32px;
    width: auto;
    display: block;
  }

  /* ── HERO SEARCH ── */
  #hero {
    padding: 56px 24px 36px;
    max-width: 700px;
    margin: 0 auto;
    text-align: center;
  }

  .search-label {
    font-size: 26px;
    font-weight: 300;
    letter-spacing: -.02em;
    color: var(--text);
    line-height: 1.25;
    margin-bottom: 28px;
  }
  .search-label strong { font-weight: 600; }

  .search-wrap {
    position: relative;
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 6px 6px 6px 18px;
    transition: border-color .2s, box-shadow .2s;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  .search-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(18,109,254,.1);
  }

  #search-input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 400;
    outline: none;
    padding: 8px 12px 8px 0;
    caret-color: var(--accent);
  }
  #search-input::placeholder { color: var(--muted); }

  #search-btn {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .1s;
    flex-shrink: 0;
  }
  #search-btn:hover { background: #1a7fff; }
  #search-btn:active { transform: scale(.95); }
  #search-btn:disabled { background: var(--surface2); cursor: not-allowed; }

  .hint {
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    align-items: center;
  }
  .hint-label { color: var(--muted); margin-right: 2px; }
  .hint span {
    display: inline-block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
    font-size: 11.5px;
    color: var(--text);
  }
  .hint span:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(18,109,254,.04);
  }

  /* ── STATUS BAR ── */
  #status {
    max-width: 700px;
    margin: 0 auto 20px;
    padding: 0 24px;
    min-height: 22px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #status.error { color: var(--danger); }
  #status.warn  { color: var(--warn); }
  #status.ok    { color: var(--success); font-weight: 500; }

  /* ── RESULTS GRID ── */
  #results {
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 24px 72px;
    columns: 4 240px;
    column-gap: 16px;
  }

  /* ── SKELETON ── */
  .skeleton-card {
    break-inside: avoid;
    margin-bottom: 16px;
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .skeleton-img {
    width: 100%;
    background: var(--surface2);
    animation: shimmer 1.4s infinite;
  }
  .skeleton-body { padding: 12px; }
  .skeleton-line {
    height: 9px;
    border-radius: 4px;
    background: var(--surface2);
    animation: shimmer 1.4s infinite;
    margin-bottom: 8px;
  }
  .skeleton-line.short { width: 50%; }
  @keyframes shimmer {
    0%   { opacity: .4; }
    50%  { opacity: .9; }
    100% { opacity: .4; }
  }

  /* ── ASSET CARD ── */
  .asset-card {
    break-inside: avoid;
    margin-bottom: 16px;
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    opacity: 0;
    transform: translateY(10px);
    animation: card-in .28s ease forwards;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .asset-card:hover {
    border-color: #c0ccff;
    box-shadow: 0 4px 16px rgba(18,109,254,.1);
    transform: translateY(-2px);
  }
  @keyframes card-in {
    to { opacity: 1; transform: translateY(0); }
  }

  .card-thumb {
    width: 100%;
    display: block;
    background: var(--surface2);
    object-fit: cover;
  }
  .card-thumb.no-thumb {
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 24px;
  }

  .card-body { padding: 10px 12px 12px; }
  .card-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .card-ext {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--surface2);
    border-radius: 4px;
    padding: 2px 6px;
  }
  .card-score {
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
  }

  /* ── EMPTY / ERROR STATES ── */
  #empty {
    display: none;
    max-width: 440px;
    margin: 60px auto;
    text-align: center;
    padding: 0 24px;
  }
  #empty .empty-icon {
    width: 48px; height: 48px;
    background: var(--surface2);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    font-size: 22px;
  }
  #empty h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
  #empty p  { font-size: 13px; color: var(--muted); line-height: 1.6; }

  /* ── SPINNER ── */
  .spinner {
    width: 13px; height: 13px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .search-label { font-size: 20px; }
    #search-input { font-size: 14px; }
    #results { columns: 2 140px; }
  }
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <div class="topbar-logo">
    <!-- Claude logo - correct asterisk mark -->
    <svg height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Claude">
      <path d="M12 2L12 6M12 18L12 22M2 12L6 12M18 12L22 12M4.93 4.93L7.76 7.76M16.24 16.24L19.07 19.07M19.07 4.93L16.24 7.76M7.76 16.24L4.93 19.07" stroke="#CC785C" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="topbar-divider"></div>
  <span class="topbar-label">Natural Language Search</span>
  <div class="topbar-spacer"></div>
  <div class="topbar-powered">
    <span>Powered by</span>
    <img src="https://dam.bynder.com/transform/025026c6-6fbc-4307-a0c2-437cdfaf407b/Bynder-Logo-Web-DAT" alt="Bynder">
  </div>
</div>

<!-- HERO -->
<div id="hero">
  <div class="search-label">Describe what you're <strong>looking for</strong></div>
  <div class="search-wrap">
    <input
      id="search-input"
      type="text"
      placeholder="e.g. lifestyle photography of people outdoors in summer"
      autocomplete="off"
      spellcheck="false"
    />
    <button id="search-btn" title="Search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
  </div>
</div>

<!-- STATUS -->
<div id="status"></div>

<!-- RESULTS -->
<div id="results"></div>

<!-- EMPTY STATE -->
<div id="empty">
  <div class="empty-icon">🔍</div>
  <h3>No matching assets found</h3>
  <p>Try a different description, or check that AI indexing is enabled on this portal in Bynder's settings.</p>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const WORKER_URL  = 'https://bynder-similarity-search.jamirahman.workers.dev/';
const PERM_TOKEN  = '759c06867bda1515045b6e3fa07a5234d0b1f384b6f8b037e7d0deb9546ebc78';
const BYNDER_DOMAIN = 'wave-us.getbynder.com';
const MAX_RESULTS = 12;

// ── UUID CONVERSION: v4 (8-4-4-4-12 lowercase) → ColdFusion (8-4-4-16 uppercase)
function v4ToColdFusion(uuid) {
  // Remove hyphens, uppercase
  const clean = uuid.replace(/-/g, '').toUpperCase();
  // Regroup as 8-4-4-16
  return `${clean.slice(0,8)}-${clean.slice(8,12)}-${clean.slice(12,16)}-${clean.slice(16)}`;
}

// ── DOM REFS ────────────────────────────────────────────────────────────────
const searchInput  = document.getElementById('search-input');
const searchBtn    = document.getElementById('search-btn');
const resultsEl    = document.getElementById('results');
const statusEl     = document.getElementById('status');
const emptyEl      = document.getElementById('empty');

// ── HINT CHIPS ──────────────────────────────────────────────────────────────
document.querySelectorAll('.hint span').forEach(chip => {
  chip.addEventListener('click', () => {
    searchInput.value = chip.textContent;
    searchInput.focus();
  });
});

// ── STATUS HELPERS ──────────────────────────────────────────────────────────
function setStatus(msg, type = '') {
  statusEl.textContent = msg;
  statusEl.className = type;
}
function setStatusWithSpinner(msg) {
  statusEl.innerHTML = '';
  statusEl.className = '';
  const spinner = document.createElement('div');
  spinner.className = 'spinner';
  statusEl.appendChild(spinner);
  const t = document.createTextNode(' ' + msg);
  statusEl.appendChild(t);
}

// ── SKELETON LOADERS ────────────────────────────────────────────────────────
function showSkeletons(n) {
  resultsEl.innerHTML = '';
  emptyEl.style.display = 'none';
  const heights = [180, 240, 160, 200, 220, 140, 190, 170, 260, 150, 210, 180];
  for (let i = 0; i < n; i++) {
    const h = heights[i % heights.length];
    resultsEl.innerHTML += `
      <div class="skeleton-card">
        <div class="skeleton-img" style="height:${h}px"></div>
        <div class="skeleton-body">
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
        </div>
      </div>`;
  }
}

// ── RENDER CARDS ────────────────────────────────────────────────────────────
function renderCards(assets) {
  resultsEl.innerHTML = '';

  if (!assets || assets.length === 0) {
    emptyEl.style.display = 'block';
    return;
  }

  emptyEl.style.display = 'none';

  assets.forEach((asset, i) => {
    const card = document.createElement('div');
    card.className = 'asset-card';
    card.style.animationDelay = `${i * 40}ms`;

    const portalLink = `https://${BYNDER_DOMAIN}/media/?mediaId=${asset.id}`;

    const score = asset.similarityScore != null
      ? Math.round(asset.similarityScore * 100) + '%'
      : '';

    const ext = (asset.extension && asset.extension[0])
      ? asset.extension[0].toUpperCase()
      : '';

    const thumb = asset.thumbnails?.webimage || asset.thumbnails?.thul || null;

    let imgHtml = '';
    if (thumb) {
      imgHtml = `<img class="card-thumb" src="${thumb}" alt="${escHtml(asset.name)}" loading="lazy" onerror="this.style.display='none'">`;
    } else {
      imgHtml = `<div class="card-thumb no-thumb">◻</div>`;
    }

    card.innerHTML = `
      ${imgHtml}
      <div class="card-body">
        <div class="card-name" title="${escHtml(asset.name)}">${escHtml(asset.name)}</div>
        <div class="card-meta">
          ${ext ? `<span class="card-ext">${ext}</span>` : '<span></span>'}
          ${score ? `<span class="card-score">${score}</span>` : ''}
        </div>
      </div>`;

    card.addEventListener('click', () => {
      window.open(portalLink, '_blank');
    });

    resultsEl.appendChild(card);
  });
}

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── ASSET DETAIL LOOKUP ─────────────────────────────────────────────────────
async function fetchAssetDetail(cfId, permToken, domain) {
  // cfId is already in ColdFusion format
  const url = `https://${domain}/api/v4/media/${cfId}/`;
  const resp = await fetch(url, {
    headers: { Authorization: `Bearer ${permToken}` }
  });
  if (!resp.ok) return null;
  const data = await resp.json();
  return data;
}

// ── MAIN SEARCH ─────────────────────────────────────────────────────────────
async function runSearch() {
  const query      = searchInput.value.trim();

  if (!query) { searchInput.focus(); return; }

  searchBtn.disabled = true;
  showSkeletons(MAX_RESULTS);
  setStatusWithSpinner(`Searching for "${query}"…`);

  try {
    // Step 1: similarity search via Worker
    const searchResp = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ textQuery: query })
    });

    if (!searchResp.ok) {
      const errData = await searchResp.json().catch(() => ({}));
      throw new Error(errData.error || `Worker returned ${searchResp.status}`);
    }

    const searchData = await searchResp.json();
    const rawAssets  = searchData.assets || [];

    if (rawAssets.length === 0) {
      resultsEl.innerHTML = '';
      emptyEl.style.display = 'block';
      setStatus('No results — AI indexing may not be active on this portal.', 'warn');
      searchBtn.disabled = false;
      return;
    }

    // Take top MAX_RESULTS, sorted by score descending
    const top = rawAssets
      .sort((a, b) => (b.similarityScore ?? 0) - (a.similarityScore ?? 0))
      .slice(0, MAX_RESULTS);

    setStatusWithSpinner(`Found ${rawAssets.length} result${rawAssets.length !== 1 ? 's' : ''} — loading details…`);

    // Step 2: enrich with asset details (parallel)
    const enriched = await Promise.all(
      top.map(async (item) => {
        const cfId   = v4ToColdFusion(item.assetId);
        const detail = await fetchAssetDetail(cfId, PERM_TOKEN, BYNDER_DOMAIN);
        if (!detail) return null;
        return { ...detail, similarityScore: item.similarityScore };
      })
    );

    const valid = enriched.filter(Boolean);

    if (valid.length === 0) {
      // Similarity search returned IDs but detail lookups all failed
      resultsEl.innerHTML = '';
      emptyEl.style.display = 'block';
      setStatus('Asset details could not be loaded — check your permanent token and portal domain.', 'error');
      searchBtn.disabled = false;
      return;
    }

    renderCards(valid);

    const shown = valid.length;
    const total = rawAssets.length;
    const msg   = total > MAX_RESULTS
      ? `Showing top ${shown} of ${total} matches`
      : `${shown} match${shown !== 1 ? 'es' : ''} found`;

    setStatus(msg, 'ok');

  } catch (err) {
    resultsEl.innerHTML = '';
    emptyEl.style.display = 'none';
    let msg = err.message || 'Unknown error';
    if (msg.includes('Failed to fetch') || msg.includes('NetworkError')) {
      msg = 'Could not reach the Worker — check the URL and that CORS is enabled.';
    }
    setStatus(msg, 'error');
  }

  searchBtn.disabled = false;
}

// ── EVENTS ──────────────────────────────────────────────────────────────────
searchBtn.addEventListener('click', runSearch);
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') runSearch();
});
</script>
</body>
</html>
